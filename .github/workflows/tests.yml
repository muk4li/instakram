name: Tests
on:
  push:
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python modules
        run: python -m compileall -q server.py parser_core.py library_db.py instagram_links.py text_analysis.py topic_clusters.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
